<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- Carrito de compras -->
  <symbol id="icono-carrito" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="21" r="1.4"></circle>
    <circle cx="18" cy="21" r="1.4"></circle>
    <path d="M2.5 3h2l2.6 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21.5 8H6"></path>
  </symbol>

  <!-- Sofá / Salas -->
  <symbol id="icono-sofa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"></path>
    <path d="M3 11h18a1 1 0 0 1 1 1v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-3a1 1 0 0 1 1-1z"></path>
    <path d="M5 17v3M19 17v3"></path>
  </symbol>

  <!-- Cama / Dormitorios -->
  <symbol id="icono-cama" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 18v-6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v6"></path>
    <path d="M2 18v2M22 18v2"></path>
    <path d="M2 13h20"></path>
    <path d="M6 10V6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4"></path>
  </symbol>

  <!-- Comedor / mesa y sillas -->
  <symbol id="icono-comedor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="8" rx="7" ry="3"></ellipse>
    <path d="M12 11v9M8 20l1-6M16 20l-1-6"></path>
  </symbol>

  <!-- Maletín / Oficina -->
  <symbol id="icono-maletin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="7" width="19" height="13" rx="2"></rect>
    <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    <path d="M2.5 12.5h19"></path>
  </symbol>

  <!-- Ubicación / pin -->
  <symbol id="icono-ubicacion" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12z"></path>
    <circle cx="12" cy="10" r="2.5"></circle>
  </symbol>

  <!-- Teléfono -->
  <symbol id="icono-telefono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 3.5h3.2l1.6 4.4-2 1.6a13 13 0 0 0 6.2 6.2l1.6-2 4.4 1.6v3.2a1.5 1.5 0 0 1-1.6 1.5A17.5 17.5 0 0 1 3 5.1a1.5 1.5 0 0 1 1.5-1.6z"></path>
  </symbol>

  <!-- Email / sobre -->
  <symbol id="icono-email" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="2"></rect>
    <path d="M3 6.5l9 6.5 9-6.5"></path>
  </symbol>

  <!-- Lupa / búsqueda -->
  <symbol id="icono-lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="7"></circle>
    <path d="M20.5 20.5l-4.8-4.8"></path>
  </symbol>

  <!-- Check / disponible -->
  <symbol id="icono-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12.5l5.2 5.2L20 6.5"></path>
  </symbol>

  <!-- Alerta triángulo / stock bajo -->
  <symbol id="icono-alerta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5l9.5 16.5H2.5z"></path>
    <path d="M12 10v4"></path>
    <circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"></circle>
  </symbol>

  <!-- Check en círculo / aviso de éxito -->
  <symbol id="icono-check-circulo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.5"></circle>
    <path d="M8 12.3l2.8 2.8 5.2-6"></path>
  </symbol>

  <!-- Alerta en círculo / aviso de error -->
  <symbol id="icono-alerta-circulo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.5"></circle>
    <path d="M12 7.5v5.5"></path>
    <circle cx="12" cy="16.5" r="0.6" fill="currentColor" stroke="none"></circle>
  </symbol>

</svg>
